[package]
name = "sagasu"
version = "0.2.1"
description = "Sagasu - 名前でも中身でも、すぐ見つかる。安全に片付くファイル検索ツール"
authors = ["Nishi-Yura"]
license = "MIT"
repository = "https://github.com/Nishi-Yura/sagasu"
edition = "2024"

[lib]
name = "sagasu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
calamine = "0.36.1"
chrono = "0.4.45"
dirs = "7.0.0"
encoding_rs = "0.8.42"
log = "0.4.34"
lopdf = "0.45.0"
notify = "8.2.0"
parking_lot = "0.12.5"
quick-xml = "0.42.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
trash = "5.2.9"
unicode-normalization = "0.1.25"
wana_kana = "5.0.0"
zip = "9.0.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
