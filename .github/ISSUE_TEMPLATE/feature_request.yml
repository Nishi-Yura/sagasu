name: 機能の要望
description: こんな機能があったらいいな、というアイデアを教えてください
title: "[要望] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        アイデアをありがとうございます。ご要望にすべてお応えできるとは限りませんが、参考にさせていただきます。
  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: いま、どんな場面で何に困っていますか？
    validations:
      required: true
  - type: textarea
    id: wanted
    attributes:
      label: 欲しい機能
      description: どんな機能があると嬉しいですか？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代わりに考えた方法
      description: 今のところ試している回避策や、ほかの案があれば教えてください。
