name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build installers and draft release (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Sagasu ${{ github.ref_name }}"
          releaseBody: |
            Sagasu ${{ github.ref_name }} のリリースです。変更点と使い方は README をご覧ください。
            https://github.com/Nishi-Yura/sagasu#readme
          releaseDraft: true
          prerelease: false
          projectPath: src-tauri
          tauriScript: cargo tauri
